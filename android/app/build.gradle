plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // ✅ Add Firebase Google Services plugin
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.bigbasket_website"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.example.bigbasket_website"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }


    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    // ✅ Import the Firebase BoM (latest version recommended)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')

    // ✅ Add Firebase dependencies as needed
    implementation 'com.google.firebase:firebase-auth'       // Firebase Authentication
    implementation 'com.google.firebase:firebase-firestore'  // Firestore Database
    implementation 'com.google.firebase:firebase-messaging'  // Firebase Cloud Messaging (FCM)
    implementation 'com.google.firebase:firebase-analytics'  // Firebase Analytics
}

flutter {
    source = "../.."
}
